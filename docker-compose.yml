# Local stack: API + Mailpit (fake SMTP inbox at http://localhost:8025)
services:
  api:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI: the "sales inbox"
      - "1025:1025" # SMTP
